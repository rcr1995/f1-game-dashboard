# Copy this file to `.streamlit/secrets.toml` for local use, or paste its
# contents into the deployment platform's secret configuration. Never commit
# real values.
F1_ENABLE_RACE_IMPORT = "1"

[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "GENERATE-A-LONG-RANDOM-VALUE"
expose_tokens = false
client_id = "YOUR-OIDC-CLIENT-ID"
client_secret = "YOUR-OIDC-CLIENT-SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[admin_auth]
allowed_issuer = "https://accounts.google.com"
allowed_subject = "YOUR-ADMIN-OIDC-SUBJECT"
# Optional defense in depth. If set, the token must contain this exact email
# and `email_verified = true`.
# allowed_email = "admin@example.com"

# GitHub App credentials are read only after the exact OIDC administrator gate
# succeeds. Install the app only on the workbook repository and grant only the
# repository Contents: write permission. Placeholder values fail closed.
[github]
owner = "YOUR-GITHUB-OWNER"
repository = "YOUR-GITHUB-REPOSITORY"
branch = "main"
workbook_path = "F1_Standings.xlsx"
app_id = "YOUR-GITHUB-APP-ID"
installation_id = 0
private_key = """-----BEGIN RSA PRIVATE KEY-----
YOUR-GITHUB-APP-PRIVATE-KEY
-----END RSA PRIVATE KEY-----"""
