[theme]
primaryColor="#E10600"
backgroundColor="#0E1117"
secondaryBackgroundColor="#161B22"
textColor="#FAFAFA"
font="sans serif"

[server]
# Streamlit 1.59 has no per-widget upload limit. OCR applies a stricter
# 12 MiB/image and 25-megapixel validation before decoding.
maxUploadSize=20
enableXsrfProtection=true
enableCORS=true
