name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m py_compile app.py admin_app.py dashboard_core.py puskas_html.py race_import.py race_ocr.py race_workbook.py race_github.py race_import_ui.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Render the Streamlit app headlessly
        shell: bash
        run: |
          python - <<'PY'
          import os
          from streamlit.testing.v1 import AppTest

          os.environ["F1_ENABLE_RACE_IMPORT"] = "1"
          app = AppTest.from_file("app.py", default_timeout=60).run()
          if app.exception:
              for error in app.exception:
                  print(error.value)
              raise SystemExit(1)
          labels = [tab.label for tab in app.tabs]
          if len(labels) != 5 or "Import" not in labels[-1]:
              raise SystemExit(f"Race importer tab was not rendered: {labels}")

          admin = AppTest.from_file("admin_app.py", default_timeout=60).run()
          if admin.exception:
              for error in admin.exception:
                  print(error.value)
              raise SystemExit(1)
          if not admin.error:
              raise SystemExit("Private updater did not fail closed without hosted secrets")
          PY
