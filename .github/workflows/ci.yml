name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m py_compile app.py dashboard_page.py admin_page.py admin_app.py admin_auth.py admin_management_ui.py dashboard_core.py league_config.py league_runtime.py league_workbook.py puskas_html.py race_correction.py race_import.py race_ocr.py race_workbook.py race_github.py race_import_ui.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Render the public Streamlit app headlessly
        shell: bash
        run: |
          python - <<'PY'
          import os
          from streamlit.testing.v1 import AppTest

          # A feature flag is never authorization. Even when it is enabled,
          # the public route must expose no importer controls.
          os.environ["F1_ENABLE_RACE_IMPORT"] = "1"
          app = AppTest.from_file("app.py", default_timeout=60).run()
          if app.exception:
              for error in app.exception:
                  print(error.value)
              raise SystemExit(1)
          if app.get("file_uploader"):
              raise SystemExit("Public dashboard exposed an Admin upload control")
          labels = [tab.label for tab in app.tabs]
          if len(labels) != 4:
              raise SystemExit(f"Public dashboard tabs changed unexpectedly: {labels}")
          PY
