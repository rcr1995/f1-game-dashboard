name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m py_compile app.py dashboard_core.py puskas_html.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Render the Streamlit app headlessly
        shell: bash
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest

          app = AppTest.from_file("app.py", default_timeout=60).run()
          if app.exception:
              for error in app.exception:
                  print(error.value)
              raise SystemExit(1)
          PY